[project]
name = "moe-router-delta"
version = "1.0.0"
description = "Training only the MoE router for a short list of experts: code, data and scripts of Solfird AI Technical Report 2026-03."
requires-python = ">=3.12"
dependencies = [
    "mlx==0.32.4",
    "mlx-lm==0.32.2",
    "datasets==5.1.0",
    "rouge-score==0.1.2",
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3"]
figures = ["matplotlib==3.9.2"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "analysis"]
addopts = "-m 'not slow and not data'"
markers = [
    "slow: loads a real model",
    "data: loads a Hugging Face dataset (network or local cache)",
]

[tool.ruff]
line-length = 120
src = ["code", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"analysis/*.py" = ["E402", "E702", "E741", "B905"]
"code/jury.py" = ["E402"]
"code/jury_d.py" = ["E402"]
